# Fire TV 用「casa バカラ」モニターアプリ(APK)を組み立てて、リリース「baccarat-tv」に置く(スロットと同じ配り方)。
# Downloader で https://github.com/rhtcinema-boop/casa-kashitaku/releases/download/baccarat-tv/casa-baccarat-tv.apk を開けば入れられる。
name: tv-apk
on:
  push:
    branches: [main]
    paths: ['tv-app/**', '.github/workflows/tv-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tv-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Build APK
        env:
          TV_KS: ${{ secrets.TV_KS }}
          TV_KS_PASS: ${{ secrets.TV_KS_PASS }}
        run: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          JAR=$(ls -d "$SDK"/platforms/android-* | sort -V | tail -1)/android.jar
          echo "build-tools: $BT / platform: $JAR"
          # 画面をアプリに内蔵(スロットと同じ)。新しい版はアプリが公開サイトから自分で取り込む
          rm -rf tv-app/assets/www && mkdir -p tv-app/assets/www/js
          cp monitor.html config.js ver.txt tv-app/assets/www/ && cp js/road-core.js tv-app/assets/www/js/
          cd tv-app
          mkdir -p out/obj out/dex
          "$BT/aapt2" compile --dir res -o out/res.zip
          "$BT/aapt2" link -o out/base.apk -I "$JAR" --manifest AndroidManifest.xml -A assets \
            --min-sdk-version 22 --target-sdk-version 30 \
            --version-code "$GITHUB_RUN_NUMBER" --version-name "1.$GITHUB_RUN_NUMBER" out/res.zip
          javac -source 8 -target 8 -nowarn -classpath "$JAR" -d out/obj $(find src -name '*.java')
          "$BT/d8" --min-api 22 --lib "$JAR" --output out/dex $(find out/obj -name '*.class')
          cp out/base.apk out/unsigned.apk
          (cd out/dex && zip -q -u ../unsigned.apk classes.dex)
          "$BT/zipalign" -f 4 out/unsigned.apk out/aligned.apk
          echo "$TV_KS" | base64 -d > out/ks.p12
          "$BT/apksigner" sign --ks out/ks.p12 --ks-type PKCS12 --ks-pass env:TV_KS_PASS --out ../casa-baccarat-tv.apk out/aligned.apk
          "$BT/apksigner" verify ../casa-baccarat-tv.apk
          rm -f out/ks.p12
      - name: Publish to release "baccarat-tv"
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view baccarat-tv >/dev/null 2>&1 || gh release create baccarat-tv -t "casa バカラ モニター Fire TV app" -n "Fire TV Stick 用 APK。Downloader で casa-baccarat-tv.apk の URL を開いてインストールします。"
          gh release upload baccarat-tv casa-baccarat-tv.apk --clobber
          gh release edit baccarat-tv -n "Fire TV Stick 用 APK（build ${GITHUB_RUN_NUMBER}）。Downloader で casa-baccarat-tv.apk の URL を開いてインストールします。"
