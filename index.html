<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="casa 貸卓">
<meta name="theme-color" content="#070a08">
<meta name="format-detection" content="telephone=no">
<title>casa 貸卓 — 入力</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-180.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="css/style.css">
<style>
  body { user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
  .wrap { max-width: 560px; margin: 0 auto; padding: calc(var(--sat) + 10px) 12px calc(var(--sab) + 90px); }
  header { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; margin-bottom: 8px; }
  h1 { margin: 0; font-size: 12px; letter-spacing: .25em; color: var(--gold); }
  .date { font-size: 13px; color: var(--dim); margin-top: 2px; }
  .status { font-size: 11px; color: var(--dim); text-align: right; }
  .status b { color: var(--plus); font-weight: 600; }
  .status b.off { color: var(--minus); }

  /* ゲーム選択 */
  .games { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
  .games button { border: 1px solid #3a3320; background: #15120a; border-radius: 12px; padding: 12px 4px; font-size: 14px; font-weight: 700; color: #cfd6cc; }
  .games button.on { background: var(--c); color: #120f08; border-color: var(--c); }

  /* 番号グリッド */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 6px; }
  .cell { position: relative; border: 1px solid #2a2416; background: var(--card); border-radius: 12px; padding: 8px 4px 6px; min-height: 64px; text-align: center; }
  .cell .n { font-size: 20px; font-weight: 700; line-height: 1; }
  .cell .nm { font-size: 11px; color: var(--dim); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell .st { font-size: 11px; margin-top: 2px; color: var(--c, #cfd6cc); white-space: nowrap; }
  .cell.reg { border-color: #4a4020; }
  .cell.act { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
  .cell.empty { opacity: .45; }
  .cell.empty .n { color: var(--dim); }

  /* 下部ナビ */
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(7, 10, 8, .96); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 8px calc(var(--sab) + 6px); z-index: 20; }
  nav button { border: 0; background: none; color: var(--dim); font-size: 12px; padding: 8px 0; }
  nav button span { display: block; font-size: 20px; margin-bottom: 2px; }
  nav button.on { color: var(--gold); }

  /* シート(モーダル) */
  .sheet { position: fixed; inset: 0; z-index: 30; display: none; }
  .sheet.show { display: block; }
  .sheet .bg { position: absolute; inset: 0; background: rgba(0, 0, 0, .6); }
  .sheet .panel { position: absolute; left: 0; right: 0; bottom: 0; max-height: 92%; overflow: auto; background: #0e130f; border-radius: 20px 20px 0 0; border-top: 1px solid #2f4a2a; padding: 14px 14px calc(var(--sab) + 16px); }
  .panel h2 { margin: 0; font-size: 22px; display: flex; align-items: baseline; gap: 10px; }
  .panel h2 small { font-size: 13px; color: var(--dim); font-weight: 400; }
  .panel .close { position: absolute; right: 12px; top: 10px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid #3a3320; background: #15120a; color: #cfd6cc; font-size: 18px; }
  .stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px 0; }
  .stat div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px; text-align: center; }
  .stat span { display: block; font-size: 11px; color: var(--dim); }
  .stat b { display: block; font-size: 20px; margin-top: 2px; }
  .stat b small { font-size: 12px; color: var(--dim); font-weight: 400; }
  .stat.one { grid-template-columns: 1fr; }
  .stat.one b { font-size: 26px; }
  .sub { font-size: 12px; color: var(--dim); text-align: center; margin-top: -6px; margin-bottom: 10px; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .acts .btn { padding: 16px 8px; font-size: 17px; font-weight: 700; border-radius: 14px; }
  .acts .btn.in { background: #1c2a16; border-color: #3b6a2a; color: #b9f0b0; }
  .acts .btn.out { background: #2a1c16; border-color: #6a3a2a; color: #f0c8b0; }
  .acts .btn.full { grid-column: 1 / -1; }
  .ins { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 10px; }
  .ins span { background: #15120a; border: 1px solid #3a3320; border-radius: 6px; padding: 2px 8px; font-size: 13px; }
  .ins span.neg { border-color: #5a2a24; color: var(--minus); }
  .others { font-size: 13px; color: var(--dim); line-height: 1.7; border-top: 1px dashed #2a2416; padding-top: 8px; }
  .others b { color: #cfd6cc; font-weight: 600; }

  /* テンキー */
  .pad { display: none; }
  .pad.show { display: block; }
  .pad .disp { background: #050706; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: grid; grid-template-columns: 1fr auto; align-items: center; margin-bottom: 8px; }
  .pad .disp b { font-size: 34px; }
  .pad .disp small { font-size: 13px; color: var(--dim); }
  .pad .disp .lbl { font-size: 12px; color: var(--c, var(--dim)); font-weight: 700; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .keys button { border: 1px solid #2a2416; background: #15120a; border-radius: 12px; padding: 14px 0; font-size: 22px; font-weight: 700; }
  .keys button:active { background: #241d0e; }
  .keys button.fn { font-size: 15px; color: var(--dim); }
  .quick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 6px; }
  .quick button { border: 1px solid #3a3320; background: #0e0c07; border-radius: 10px; padding: 9px 0; font-size: 14px; color: #cfd6cc; }
  .confirm { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 8px; }
  .confirm .btn { padding: 16px; font-size: 17px; }

  /* 名前入力 */
  .nameform { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin: 10px 0; }
  .nameform input { border: 1px solid #3a3320; background: #0e0c07; color: #e8e3d2; border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 18px; min-width: 0; }

  /* 履歴 */
  .log { margin-top: 4px; }
  .log .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 12px; border-top: 1px solid #1d1a10; }
  .log .row:first-child { border-top: 0; }
  .log .row .t { font-size: 15px; } .log .row .t i { display: block; font-style: normal; font-size: 12px; color: var(--dim); margin-top: 2px; }
  .log .row button { border: 1px solid #6a2a20; background: #2a120f; color: #ffb3a8; border-radius: 10px; padding: 8px 12px; font-size: 13px; }
  .hright { display: flex; align-items: center; gap: 8px; }
  .syncbtn { display: flex; flex-direction: column; align-items: center; border: 1px solid #3a3320; background: #15120a; color: #cfd6cc; border-radius: 10px; padding: 5px 12px; min-width: 76px; }
  .syncbtn b { font-size: 14px; }
  .syncbtn small { font-size: 10px; color: var(--dim); margin-top: 1px; white-space: nowrap; }
  .syncbtn.dirty { background: linear-gradient(180deg, #ffe9a8, #c9a03e); color: #1a1408; border-color: #c9a03e; }
  .syncbtn.dirty small { color: #3a2a08; font-weight: 700; }
  .syncbtn.spin { opacity: .6; pointer-events: none; }
  .sheetbtn { border: 1px solid #2f4a2a; background: #11190f; color: #b9f0b0; border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 700; text-decoration: none; }
  .tourbar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
  .tourbar div { background: rgba(199, 125, 255, .1); border: 1px solid #5a3a7a; border-radius: 12px; padding: 8px; text-align: center; }
  .tourbar span { display: block; font-size: 11px; color: var(--dim); }
  .tourbar b { font-size: 24px; color: #e4c8ff; }
  .tourbar small { font-size: 12px; color: var(--dim); font-weight: 400; margin-left: 2px; }
  .acts .btn.re { background: #16213a; border-color: #2a4a7a; color: #b0ccf0; }
  .acts .btn.bust { background: #1a1a1a; border-color: #444; color: #ccc; }
  .acts .btn.bust[disabled] { opacity: .35; }
  .ranks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
  .ranks .rank { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 4px; background: #2a1c16; border-color: #6a3a2a; color: #f0c8b0; }
  .ranks .rank span { font-size: 13px; color: var(--dim); }
  .ranks .rank b { font-size: 20px; }
  .ranks .rank i { font-style: normal; font-size: 11px; color: var(--dim); }
  .ranks .rank[disabled] { opacity: .35; }
  .log .row button.arm { background: #c0392b; color: #fff; border-color: #c0392b; }
  .log.mini { margin-top: 4px; max-height: 40vh; overflow: auto; }
  .log.mini .row { padding: 8px 12px; }
  .empty { padding: 24px; text-align: center; color: var(--dim); font-size: 14px; }

  /* 設定 */
  .set .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 12px 14px; border-top: 1px solid #1d1a10; }
  .set .row:first-child { border-top: 0; }
  .set .row span { font-size: 14px; } .set .row span i { display: block; font-style: normal; font-size: 12px; color: var(--dim); }
  .set .row b { font-size: 18px; }
  .set .row .btn { padding: 10px 14px; }
  .set input[type=date] { border: 1px solid #3a3320; background: #0e0c07; color: #e8e3d2; border-radius: 10px; padding: 8px 10px; font: inherit; }
  .sec-h { margin: 14px 4px 6px; font-size: 12px; letter-spacing: .2em; color: var(--gold); font-weight: 600; }
  .roster { display: grid; grid-template-columns: 1fr 1fr; }
  .roster .r { display: grid; grid-template-columns: 30px 1fr; gap: 6px; align-items: center; padding: 6px 8px; border-top: 1px solid #1d1a10; }
  .roster .r small { color: var(--dim); font-weight: 700; text-align: right; }
  .roster .r input { width: 100%; min-width: 0; border: 1px solid #2a2416; background: #0e0c07; color: #e8e3d2; border-radius: 8px; padding: 8px 8px; font: inherit; font-size: 15px; }
  .roster .r input.saved { border-color: #3b6a2a; }
  .prize-r { display: grid; grid-template-columns: 56px 1fr auto; gap: 8px; align-items: center; padding: 8px 14px; border-top: 1px solid #1d1a10; }
  .prize-r:first-child { border-top: 0; }
  .prize-r b { font-size: 18px; }
  .summary-tab .stat b { font-size: 18px; }
  .summary-tab .list .row { display: grid; grid-template-columns: 32px 1fr auto; gap: 8px; align-items: center; padding: 10px 12px; border-top: 1px solid #1d1a10; }
  .summary-tab .list .row:first-child { border-top: 0; }
  .summary-tab .list .row i { display: block; font-style: normal; font-size: 11px; color: var(--dim); margin-top: 2px; }
  .summary-tab .list .row b { font-size: 17px; }
  .preview { margin-top: 10px; }
  .preview canvas, .preview img { width: 100%; border-radius: 12px; border: 1px solid var(--line); }
  .hide { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>casa 貸卓</h1><div class="date" id="hDate"></div></div>
    <div class="hright"><div class="status" id="status"></div><a class="sheetbtn" id="hSheet" target="_blank" rel="noopener">シート</a><button class="syncbtn" id="syncBtn"><b>⟳ 同期</b><small id="syncCount"></small></button></div>
  </header>

  <!-- 入力タブ -->
  <section id="tab-input">
    <div class="games" id="games">
      <button data-game="bac" class="g-bac on">バカラ</button>
      <button data-game="cash" class="g-cash">リング</button>
      <button data-game="tour" class="g-tour">トーナメント</button>
      <button data-game="dealer" class="g-dealer">ディーラー</button>
    </div>
    <div class="tourbar" id="tourBar" style="display:none"></div>
    <div class="grid" id="grid"></div>
    <div class="card" id="dealerBox" style="display:none; padding: 14px;">
      <div style="font-size:13px;color:var(--dim);margin-bottom:8px;">バカラ卓のディーラー手元チップの増減を記録します。補充(+)・回収(-)、マイナス入力も可。</div>
      <div class="acts">
        <button class="btn in" data-dealer="bac" data-type="in">チップ 補充</button>
        <button class="btn out" data-dealer="bac" data-type="out">チップ 回収</button>
      </div>
      <div id="dealerStat" class="others"></div>
    </div>
  </section>

  <!-- 履歴タブ -->
  <section id="tab-log" class="hide">
    <div class="card log" id="logList"></div>
  </section>

  <!-- 収支タブ -->
  <section id="tab-sum" class="hide summary-tab">
    <div class="stat" id="sumStat"></div>
    <div class="acts"><button class="btn gold full" id="makeImage">収支一覧の画像を作る・共有</button></div>
    <div class="preview" id="preview"></div>
    <div class="card list" id="sumList"></div>
  </section>

  <!-- 設定タブ(初期設定) -->
  <section id="tab-set" class="hide">
    <h3 class="sec-h">イベント</h3>
    <div class="card set">
      <div class="row"><span>日付<i>この日のタブに記録されます</i></span><input type="date" id="setDate"></div>
      <div class="row"><span>トーナメント エントリー<i>1回の金額(万)</i></span><button class="btn" id="setTourFee"><b></b> 万</button></div>
      <div class="row"><span>トーナメント リエントリー<i>1回の金額(万)</i></span><button class="btn" id="setReFee"><b></b> 万</button></div>
    </div>

    <h3 class="sec-h">プライズ(順位ごとの賞金・万)</h3>
    <div class="card set" id="prizeBox">
      <div id="prizeRows"></div>
      <div class="row"><span>合計<i id="prizeInfo"></i></span><b id="prizeTotal"></b></div>
      <div class="row" style="grid-template-columns:1fr 1fr;gap:8px"><button class="btn" id="prizeAdd">順位を追加</button><button class="btn" id="prizeDel">最後を削除</button></div>
    </div>

    <h3 class="sec-h">会計札と名前の紐づけ</h3>
    <div class="card set">
      <div class="row" style="grid-template-columns:1fr"><span style="color:var(--dim);font-size:12px">名前を入れて次の欄に進むと自動で保存されます。空欄は未登録のままです。</span></div>
      <div id="rosterRows" class="roster"></div>
    </div>

    <h3 class="sec-h">その他</h3>
    <div class="card set">
      <div class="row"><span>保存先<i id="setModeInfo"></i></span><b id="setMode"></b></div>
      <div class="row"><span>スプレッドシート</span><a class="btn" id="openSheet" target="_blank" rel="noopener" style="text-decoration:none">開く</a></div>
      <div class="row"><span>PC ボード<i>パソコンで開く画面</i></span><a class="btn" href="board.html" target="_blank" style="text-decoration:none">開く</a></div>
      <div class="row"><span>この日のデータを全消去<i>テスト後の片付け用。元に戻せません</i></span><button class="btn red" id="clearDay">全消去</button></div>
    </div>
  </section>
</div>

<nav id="nav">
  <button data-tab="input" class="on"><span>⌨︎</span>入力</button>
  <button data-tab="log"><span>☰</span>履歴</button>
  <button data-tab="sum"><span>¥</span>収支</button>
  <button data-tab="set"><span>⚙︎</span>設定</button>
</nav>

<!-- プレイヤーシート -->
<div class="sheet" id="sheet">
  <div class="bg" data-close></div>
  <div class="panel" id="panel"></div>
</div>

<div class="toast" id="toast"><div><div class="t1" id="toastT1"></div><div class="t2" id="toastT2"></div></div><button class="btn ghost" id="toastUndo">取り消し</button></div>

<script src="config.js"></script>
<script src="js/model.js"></script>
<script src="js/api.js"></script>
<script src="js/image.js"></script>
<script src="js/phone.js"></script>
</body>
</html>
