    function check() {
      fetch('ver.txt?_=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (v) {

        if (!v || v === window.KT_VER) return;

        if (u.searchParams.get('kv') === v) return; // 同じ版で読み直し済みなら繰り返さない

        location.replace(u.toString());
      }).catch(function () {});
    }
    check();
    document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  })();

<style>
  body { user-select: none; -webkit-user-select: none; overscroll-behavior: none; overflow-wrap: anywhere; }
  .wrap { margin: 0 auto; padding: 12px max(16px, env(safe-area-inset-right)) calc(var(--sab) + 104px) max(16px, env(safe-area-inset-left)); }
  #tab-sum { max-width: 900px; margin: 0 auto; }

  /* ===== 上のバー(ガラス・上に固定) ===== */
  .topbar { position: sticky; top: 0; z-index: 15; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px;
    padding: calc(var(--sat) + 8px) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
    background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border-bottom: .5px solid var(--glass-line); box-shadow: 0 1px 0 rgba(0, 0, 0, .03); }
  .topbar > div:first-child { min-width: 0; }
  h1 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--text2); text-transform: uppercase; }
  .date { font-size: clamp(20px, 4.2vw, 30px); font-weight: 800; letter-spacing: -.02em; margin-top: 0; white-space: nowrap; }

  .hright { display: flex; align-items: center; gap: 8px; }
  .gbtn { border: .5px solid var(--glass-line); background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--glass-hi), 0 2px 10px rgba(20, 30, 70, .08); color: var(--blue); }
  .gbtn:active { transform: scale(.96); }
  .syncbtn { display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 22px; padding: 6px 14px; min-width: 92px; min-height: 44px; }
  .syncbtn b { font-size: 16px; font-weight: 700; }

  /* ===== ゲームの道具(バカラ: ディーラー・3枚目・罫線 / トナメ: 人数・プール・プライズ) ===== */
  .tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
  .tools.tour { grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.1fr); }
  .tool { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 0; min-height: 60px; padding: 8px 6px; border-radius: 20px; color: var(--text); text-decoration: none; font: inherit; text-align: center; }
  .tool b { font-size: clamp(16px, 3.4vw, 22px); font-weight: 800; letter-spacing: -.01em; white-space: nowrap; color: var(--c, var(--text)); }
  .tool span { font-size: 12px; color: var(--text2); font-weight: 600; white-space: nowrap; }
  .tool b small { font-size: .62em; color: var(--text2); font-weight: 600; margin-left: 2px; }
  button.tool:active, a.tool:active { transform: scale(.97); }
  .tool.t-dealer { --c: var(--blue); } .tool.t-draw { --c: var(--indigo); } .tool.t-road { --c: var(--red); } .tool.t-stat { --c: var(--indigo); }

  .tool.t-prize b, .tool.t-prize span { color: #fff; }

  /* ===== 集計: 収支 / 履歴 の切り替え ===== */
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 24px; max-width: 440px; margin: 0 auto 14px; }
  .seg button { border: 0; background: transparent; border-radius: 20px; padding: 10px 6px; font-size: 16px; font-weight: 700; color: var(--text2); white-space: nowrap; transition: background .2s, color .2s; }
  .seg button.on { background: var(--glass-sel); color: var(--text); box-shadow: var(--glass-hi), 0 2px 8px rgba(20, 30, 70, .1); }

  /* 番号グリッド(1行5人) */
  .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-auto-rows: 110px; gap: 10px; }
  .cell { position: relative; border: 0; background: var(--card); border-radius: 18px; padding: 6px 4px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3em; min-width: 0; overflow: hidden; box-shadow: var(--shadow); transition: transform .1s; font-size: clamp(14px, 2.6vw, 24px); }
  .cell:active { transform: scale(.96); }
  .cell .n { font-size: 2.3em; font-weight: 700; line-height: 1; letter-spacing: -.03em; color: var(--text); }
  .cell .nm { font-size: 1em; color: var(--text); font-weight: 500; max-width: 100%; line-height: 1.15; overflow-wrap: anywhere; }
  .cell .st { font-size: .85em; color: var(--c); max-width: 100%; line-height: 1.15; overflow-wrap: anywhere; font-weight: 600; }
  .cell.act { box-shadow: inset 0 0 0 2.5px var(--c), var(--shadow); }
  .cell.out { opacity: .42; box-shadow: none; background: var(--fill); }

  .cell.empty .nm { color: var(--text2); }
  .cell .n.dl { font-size: 1.15em; letter-spacing: 0; }
  .dealer-cell { background: var(--blue-tint); }
  .draw-cell { background: var(--indigo-tint); }
  .draw-cell .n.dl { color: var(--indigo); }
  /* 3枚目の判定 */
  .bd-hands { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 10px; }
  .bd-hand { background: var(--card); border-radius: 16px; padding: 10px; text-align: center; box-shadow: var(--shadow); min-width: 0; }
  .bd-hand.p .bd-name { color: var(--blue); } .bd-hand.b .bd-name { color: var(--red); }
  .bd-hand.turn { box-shadow: inset 0 0 0 2.5px var(--indigo), var(--shadow); }
  .bd-hand.win { background: var(--blue-tint); }
  .bd-hand.b.win { background: var(--red-tint); }
  .bd-name { font-size: 17px; font-weight: 700; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 8px; font-size: 14px; color: var(--text2); }
  .bd-v { min-width: 44px; padding: 4px 8px; border-radius: 10px; background: var(--bg); color: var(--text); font-size: clamp(20px, 5vw, 26px); text-align: center; }
  .bd-v.empty { color: var(--text2); background: transparent; box-shadow: inset 0 0 0 1.5px var(--sep); }
  .bd-v.next { color: var(--indigo); box-shadow: inset 0 0 0 2.5px var(--indigo); }
  .bd-total { font-size: clamp(30px, 7vw, 44px); font-weight: 700; display: block; min-height: 1.1em; }
  .bd-msg { text-align: center; font-size: 19px; padding: 10px; border-radius: 14px; background: var(--fill); margin-bottom: 8px; }
  .bd-msg b { color: var(--indigo); }
  .bd-msg.done { font-size: 26px; font-weight: 700; }
  .bd-msg.done small { display: block; font-size: 16px; font-weight: 500; color: var(--text2); }
  .bd-msg.done em { display: block; font-style: normal; font-size: 17px; color: var(--red); margin-top: 4px; }
  .bd-msg.player { background: var(--blue-tint); color: var(--blue); } .bd-msg.banker { background: var(--red-tint); color: var(--red); } .bd-msg.tie { background: var(--fill2); }
  .bd-why { margin: 0 0 10px; padding-left: 1.2em; font-size: 15px; color: var(--text2); line-height: 1.6; }
  .bd-say { background: var(--card); border-radius: 16px; padding: 12px 16px; margin-bottom: 10px; box-shadow: inset 0 0 0 2px var(--indigo), var(--shadow); }
  .bd-say span { display: block; font-size: 13px; font-weight: 700; color: var(--indigo); margin-bottom: 4px; }
  .bd-say p { margin: 2px 0; font-size: clamp(19px, 4.6vw, 26px); font-weight: 700; line-height: 1.35; }
  .bd-say p.past { font-size: 15px; font-weight: 500; color: var(--text2); }
  .bd-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .bd-keys button { position: relative; border: 0; background: var(--card); border-radius: 14px; padding: 16px 0; font-size: clamp(26px, 5vw, 36px); font-weight: 600; box-shadow: var(--shadow); min-width: 0; line-height: 1.1; }
  /* 補足の小さい文字はボタンの下に重ねる(出たり消えたりしてもボタンの大きさ・位置が変わらない) */
  .bd-keys button small { position: absolute; left: 0; right: 0; bottom: 3px; font-size: 11px; line-height: 13px; white-space: nowrap; overflow: hidden; color: var(--text2); font-weight: 500; }
  .bd-keys button[disabled] { opacity: .35; }
  .bd-keys .bd-back { background: var(--fill); color: var(--blue); font-size: clamp(22px, 4.6vw, 30px); }
  .bd-keys .bd-back small { color: var(--blue); }
  .bd-keys .bd-back[disabled] { opacity: .35; }
  .bd-keys button:active { background: var(--fill2); }
  .bd-rule { margin-top: 6px; font-size: 14px; }
  .bd-rule summary { color: var(--blue); font-weight: 600; padding: 8px 2px; cursor: pointer; }
  .bd-rule table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; }
  .bd-rule th, .bd-rule td { text-align: left; padding: 8px 10px; border-top: .5px solid var(--sep); vertical-align: top; }
  .bd-rule th { color: var(--text2); font-weight: 600; width: 38%; }
  .nogrid { grid-column: 1 / -1; text-align: center; color: var(--text2); font-size: 19px; line-height: 2.4; padding: 50px 10px; }
  /* ===== 下のタブバー(浮かぶガラス) ===== */
  .tabbar { position: fixed; z-index: 20; left: 0; right: 0; bottom: calc(var(--sab) + 10px); margin: 0 auto; width: min(600px, calc(100% - 20px));
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; padding: 6px; border-radius: 34px; }
  .tabbar button { border: 0; background: transparent; border-radius: 28px; min-width: 0; padding: 6px 0 5px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: var(--text2); font-size: 11px; font-weight: 700; white-space: nowrap; transition: background .2s, color .2s; }
  .tabbar button.on { color: var(--c, var(--blue)); background: var(--glass-sel); box-shadow: var(--glass-hi), 0 2px 10px rgba(20, 30, 70, .12); }
  .tabbar svg { width: 26px; height: 26px; }

  /* シート(下から出る画面) */
  .sheet { position: fixed; inset: 0; z-index: 30; display: none; }
  .sheet.show { display: block; }
  .sheet .bg { position: absolute; inset: 0; background: rgba(0, 0, 0, .35); animation: fade .2s; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { transform: translateY(40px); opacity: .4; } }
  .sheet .panel { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 760px; max-height: 94%; overflow: auto; background: var(--bg); border-radius: 22px 22px 0 0; padding: 20px 18px calc(var(--sab) + 20px); animation: rise .25s cubic-bezier(.2, .9, .3, 1); }
  .sheet .panel::before { content: ''; position: absolute; top: 7px; left: 50%; width: 38px; height: 5px; margin-left: -19px; border-radius: 3px; background: var(--fill2); }
  .panel h2 { margin: 0; font-size: clamp(26px, 4.2vw, 36px); font-weight: 700; letter-spacing: -.02em; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding-right: 44px; overflow-wrap: anywhere; }
  .panel h2 small { font-size: 16px; color: var(--text2); font-weight: 500; }
  .panel .close { position: absolute; right: 16px; top: 18px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--fill); color: var(--text2); font-size: 16px; font-weight: 700; }
  .stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
  .stat div { background: var(--card); border-radius: 16px; padding: 12px 8px; text-align: center; box-shadow: var(--shadow); min-width: 0; }
  .stat span { display: block; font-size: 14px; color: var(--text2); font-weight: 500; }
  .stat b { display: block; font-size: clamp(24px, 4.6vw, 38px); font-weight: 700; margin-top: 2px; letter-spacing: -.02em; white-space: nowrap; }
  .stat b small { font-size: 15px; color: var(--text2); font-weight: 500; }
  .stat .diff-ok { box-shadow: inset 0 0 0 2px var(--blue), var(--shadow); } .stat .diff-ok b, .stat .diff-ok small { color: var(--blue); }
  .stat .diff-ng { box-shadow: inset 0 0 0 2px var(--red), var(--shadow); } .stat .diff-ng b, .stat .diff-ng small { color: var(--red); }
  .stat > div > small { display: block; font-size: 13px; font-weight: 700; }
  .sub { font-size: 13px; color: var(--text2); text-align: center; margin-top: -6px; margin-bottom: 10px; }

  /* 操作ボタン */
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .acts .btn { padding: 22px 8px; font-size: clamp(19px, 3.4vw, 26px); font-weight: 600; border-radius: 16px; }
  .acts .btn small { font-size: .65em; font-weight: 500; opacity: .85; }
  .acts .btn.in { background: var(--blue); color: #fff; }
  .acts .btn.out { background: var(--card); color: var(--blue); box-shadow: inset 0 0 0 2px var(--blue); }
  .acts .btn.re { background: var(--indigo); color: #fff; }
  .acts .btn.bust { background: var(--fill); color: var(--text); }
  .acts .btn.bust[disabled] { opacity: .35; }
  .acts .btn.home { background: var(--card); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--sep), var(--shadow); }
  .home-h { color: var(--blue); }
  .acts .btn.full { grid-column: 1 / -1; }
  .ins { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
  .ins span { background: var(--fill); border-radius: 999px; padding: 3px 10px; font-size: 14px; }
  .ins span.neg { color: var(--red); }
  .others { font-size: 14px; color: var(--text2); line-height: 1.7; border-top: .5px solid var(--sep); padding-top: 8px; }

  /* 賞金の順位 */
  .ranks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
  .ranks .rank { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 16px 4px; background: var(--card); color: var(--text); box-shadow: var(--shadow); border-radius: 16px; }
  .ranks .rank span { font-size: 15px; color: var(--indigo); font-weight: 700; }
  .ranks .rank b { font-size: clamp(24px, 4.2vw, 34px); font-weight: 700; }
  .ranks .rank i { font-style: normal; font-size: 12px; color: var(--text2); }
  .ranks .rank[disabled] { opacity: .35; }
  .ranks .rank.sugg, .acts .btn.sugg { box-shadow: inset 0 0 0 3px var(--blue), var(--shadow); }
  .pick-h { font-size: 20px; font-weight: 700; margin: 4px 2px 12px; }
  .pick-h small { display: block; font-size: 15px; font-weight: 500; color: var(--text2); margin-top: 2px; }

  /* テンキー */
  .pad { display: none; }
  .pad.show { display: block; }
  .pad .disp { background: var(--card); border-radius: 16px; padding: 12px 16px; display: grid; grid-template-columns: 1fr auto; align-items: center; margin-bottom: 10px; box-shadow: var(--shadow); }
  .pad .disp b { display: block; font-size: clamp(36px, 6vw, 52px); font-weight: 700; letter-spacing: -.03em; white-space: nowrap;
    /* 桁数で文字が小さくなっても高さは変えない(下のテンキーが動かないように) */
    height: calc(1.15 * clamp(36px, 6vw, 52px)); line-height: calc(1.15 * clamp(36px, 6vw, 52px)); }
  .pad .disp .lbl { line-height: 17px; height: 17px; }
  .pad .disp > div:first-child { min-width: 0; }
  .pad .disp > small { max-height: 3.6em; overflow: hidden; }
  .pad .disp b small { font-size: 18px; color: var(--text2); font-weight: 500; }
  .pad .disp small { font-size: 15px; color: var(--text2); text-align: right; }
  .pad .disp .lbl { font-size: 14px; color: var(--blue); font-weight: 700; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .keys button { border: 0; background: var(--card); border-radius: 14px; padding: 18px 0; font-size: clamp(26px, 4.6vw, 36px); font-weight: 500; box-shadow: var(--shadow); }
  .keys button:active { background: var(--fill2); }
  .keys button.fn { font-size: 20px; color: var(--text2); background: transparent; box-shadow: none; }
  .quick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 8px; }
  .quick button { border: 0; background: var(--blue-tint); color: var(--blue); border-radius: 12px; padding: 13px 0; font-size: clamp(16px, 2.8vw, 22px); font-weight: 600; }
  .confirm { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 10px; }
  .confirm .btn { padding: 18px; font-size: 18px; }

  /* 名前入力 */
  .nameform { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin: 14px 0; }
  .nameform input { border: 0; background: var(--card); color: var(--text); border-radius: 12px; padding: 14px 16px; font: inherit; font-size: 20px; min-width: 0; box-shadow: var(--shadow); }

  /* 一覧(履歴・設定) */
  .log { margin-top: 4px; }
  .log .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 12px 16px; border-top: .5px solid var(--sep); }
  .log .row:first-child { border-top: 0; }
  .log .row .t { font-size: 18px; } .log .row .t i { display: block; font-style: normal; font-size: 14px; color: var(--text2); margin-top: 2px; }
  .log .row button { border: 0; background: var(--red-tint); color: var(--red); border-radius: 999px; padding: 12px 20px; font-size: 17px; font-weight: 600; }
  .log .row button.arm { background: var(--red); color: #fff; }
  .log.mini { margin-top: 4px; max-height: 40vh; overflow: auto; }
  .log.mini .row { padding: 10px 16px; }
  .empty:not(.bd-v) { padding: 28px; text-align: center; color: var(--text2); font-size: 16px; } /* 3枚目の空欄(.bd-v.empty)には付けない(枠が大きくなっていた) */
  .set .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 13px 16px; border-top: .5px solid var(--sep); }
  .set .row:first-child { border-top: 0; }
  .set .row span { font-size: 17px; } .set .row span i { display: block; font-style: normal; font-size: 14px; color: var(--text2); }
  .set .row b { font-size: 18px; }
  .set .row .btn { padding: 12px 18px; font-size: 17px; }
  .set input[type=date] { border: 0; background: var(--fill); color: var(--text); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 17px; }
  .sec-h { margin: 22px 16px 7px; font-size: 13px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: .02em; }
  .roster { display: grid; grid-template-columns: 1fr 1fr; }
  .roster .r { display: grid; grid-template-columns: 32px 1fr; gap: 8px; align-items: center; padding: 7px 12px; border-top: .5px solid var(--sep); }
  .roster .r small { color: var(--text2); font-weight: 600; font-size: 15px; text-align: right; }
  .roster .r input { width: 100%; min-width: 0; border: 0; background: var(--fill); color: var(--text); border-radius: 10px; padding: 9px 10px; font: inherit; font-size: 17px; }
  .roster .r input.saved { background: var(--blue-tint); }

    .bd-keys { gap: 6px; margin-bottom: 8px; } .bd-keys button { padding: 7px 0 13px; font-size: 26px; }

  /* 狭い幅(iPad の Slide Over・1/3 表示) */
  @media (max-width: 380px) {

  /* タブレット横向き: 1列の人数を増やし、下から出る画面を1画面に収める(縦向きは今まで通り) */

  /* スマホ横向き(高さが低い横画面): 上と下を詰めて、1列の人数を増やす。下から出る画面は高さいっぱい・左右2列 */
  @media (orientation: landscape) and (max-height: 599px) {

    .syncbtn { flex-direction: row; gap: 8px; padding: 6px 12px; min-width: 0; min-height: 36px; } .syncbtn b { font-size: 15px; } .syncbtn small { margin-top: 0; }
    .iconbtn { width: 36px; height: 36px; } .iconbtn svg { width: 20px; height: 20px; }
    .tools { margin-bottom: 8px; gap: 8px; } .tool { min-height: 0; padding: 5px 8px; flex-direction: row; gap: 8px; border-radius: 16px; } .tool b { font-size: 17px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
    .cell { font-size: 13px; border-radius: 16px; }

    .toast { top: calc(var(--sat) + 8px); }
    .sheet .panel { max-height: 100%; max-width: 1000px; border-radius: 16px 16px 0 0; padding: 14px max(16px, env(safe-area-inset-right)) calc(var(--sab) + 10px) max(16px, env(safe-area-inset-left)); }

    .panel .close { top: 10px; }
    .stat { margin: 8px 0; gap: 8px; } .stat div { padding: 6px 8px; } .stat b { font-size: 22px; } .stat span { font-size: 13px; }
    .acts { gap: 8px; margin-bottom: 8px; } .acts .btn { padding: 10px 8px; font-size: 18px; }

    .ranks { gap: 8px; } .ranks .rank { padding: 8px 4px; } .ranks .rank b { font-size: 22px; }
    /* テンキー: 左に表示・よく使う金額・確定、右に数字 */
    .pad.show { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); grid-template-areas: "disp keys" "quick keys" "confirm keys"; column-gap: 12px; align-items: start; }
    .pad .disp { grid-area: disp; padding: 6px 12px; margin-bottom: 8px; } .pad .quick { grid-area: quick; } .pad .keys { grid-area: keys; } .pad .confirm { grid-area: confirm; margin-top: 0; }

    .confirm .btn { padding: 12px; font-size: 16px; }

    .bd-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
    .bd-hands { margin: 8px 0 6px; gap: 8px; } .bd-hand { padding: 6px 8px; } .bd-name { font-size: 15px; }
    .bd-row { margin-top: 4px; } .bd-v { font-size: 18px; padding: 2px 6px; min-width: 36px; } .bd-total { font-size: 26px; }
    .bd-msg { font-size: 15px; padding: 6px; margin-bottom: 6px; } .bd-msg.done { font-size: 19px; } .bd-msg.done small { font-size: 13px; } .bd-msg.done em { font-size: 14px; }
    .bd-say { padding: 8px 12px; margin-bottom: 6px; } .bd-say span { font-size: 12px; margin-bottom: 2px; } .bd-say p { font-size: 16px; } .bd-say p.past { font-size: 13px; }
    .bd-keys { gap: 6px; margin-bottom: 6px; } .bd-keys button { padding: 8px 0; font-size: 24px; }
  }

  /* ===== ガラス調の部品(上の指定の見た目だけを上書き) ===== */
  .cell { background: var(--card); border: .5px solid var(--glass-line); box-shadow: var(--glass-hi), var(--shadow); }

  @media (max-width: 480px) { .roster { grid-template-columns: 1fr; } } /* 名前を最後まで見せる */
  .hint { display: inline-block; margin-left: 8px; vertical-align: middle; text-transform: none; letter-spacing: 0; }

<body>
<header class="topbar">
  <div><h1>casa 貸卓</h1><div class="date" id="hDate"></div></div>
  <div class="hright"><div class="status" id="status"></div><button class="syncbtn gbtn" id="syncBtn"><b>⟳ 同期</b><small id="syncCount"></small></button><button class="iconbtn gbtn" id="openSet" aria-label="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button></div>

<div class="wrap">

  <section id="tab-input">
    <div class="tools" id="tools"></div>
    <div class="grid" id="grid"></div>

  <!-- お客様 -->
  <section id="tab-players" class="hide">
    <div class="stat" id="plStat"></div>

<!-- 設定(右上の歯車) -->
<div class="sheet" id="setSheet" data-overlay>

      <div class="row"><span>スプレッドシート</span><a class="btn" id="openSheet" target="_blank" rel="noopener" style="text-decoration:none">開く</a></div>
      <div class="row"><span>PC ボード</span><a class="btn" href="board.html" target="_blank" style="text-decoration:none">開く</a></div>
      <div class="row"><span>今すぐロック</span><button class="btn" id="lockNow">ロック</button></div>
      <div class="row"><span>この日を全消去<i>元に戻せません</i></span><button class="btn red" id="clearDay">全消去</button></div>
    </div>
  </div>
</div>

<!-- トナメの設定とプライズ(トナメの上の「プライズ」) -->
<div class="sheet" id="prizeSheet" data-overlay>
  <div class="bg" data-close-sheet></div>
  <div class="panel">
    <button class="close" data-close-sheet aria-label="閉じる">✕</button>
    <h2 class="g-tour">プライズ</h2>
    <h3 class="sec-h">1回の金額</h3>
    <div class="card set">
      <div class="row"><span>エントリー</span><button class="btn" id="setTourFee"><b></b> 万</button></div>
      <div class="row"><span>リエントリー</span><button class="btn" id="setReFee"><b></b> 万</button></div>
    </div>

    <h3 class="sec-h">自動計算<details class="hint"><summary aria-label="説明">?</summary><p>X人に入賞、いちばん下は Y万。下から 0a・1a・3a・6a・10a… と上乗せ。1位以外は5万単位に切り捨て、余りは1位。</p></details></h3>
    <div class="card set" id="prizeCalc">
      <div class="row"><span>プール<i id="pcPoolInfo"></i></span><b id="pcPool"></b></div>
      <div class="row"><span>入賞人数 X</span><div class="stepper" data-k="x"><button data-d="-1">−</button><b id="pcX"></b><button data-d="1">＋</button></div></div>
      <div class="row"><span>最低賞金 Y</span><div class="stepper" data-k="y"><button data-d="-5">−5</button><button data-d="-1">−</button><b id="pcY"></b><button data-d="1">＋</button><button data-d="5">＋5</button></div></div>
      <div class="row"><span>上乗せ a</span><b id="pcA"></b></div>
      <div class="row" style="grid-template-columns:1fr"><button class="btn gold big" id="pcCalc">自動計算</button></div>
      <div id="pcDraft" class="hide">
        <div class="row" style="grid-template-columns:1fr"><span style="font-size:14px;color:var(--text2)">金額はタップして直せます(万)</span></div>
        <div id="pcRows"></div>
        <div class="row"><span>合計<i id="pcDiff"></i></span><b id="pcSum"></b></div>
        <div class="row" style="grid-template-columns:1fr 1fr;gap:10px"><button class="btn big" data-prize-text="draft">テキストで共有</button><button class="btn gold big" id="pcApply">確定して適用</button></div>
      </div>
    </div>

    <h3 class="sec-h">適用中</h3>
    <div class="card set">
      <div id="prizeRows"></div>
      <div class="row"><span>合計<i id="prizeInfo"></i></span><b id="prizeTotal"></b></div>
      <div class="row" id="prizeTextRow" style="grid-template-columns:1fr"><button class="btn big" data-prize-text="applied">テキストで共有・コピー</button></div>
    </div>
  </div>
</div>
