<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="請求書入力">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1424" media="(prefers-color-scheme: dark)">
<title>請求書かんたん入力</title>
<style>
/* 請求書かんたん入力: 店舗 → 名前 → 写真 → 確認 → 完了。文字は最小限、説明は「?」の中。 */
:root{--bg:#f2f4f7;--panel:#fff;--fg:#14213d;--muted:#5f6b80;--line:#e3e7ee;--accent:#1f5fe0;--accent-soft:#e8effd;--accent-fg:#fff;
 --ok:#0e7a43;--ok-bg:#e2f5ea;--warn:#8a4b00;--warn-bg:#fff2d9;--warn-line:#e8a33d;--bad:#c22b2b;--bad-bg:#fde7e7;--shadow:0 1px 2px rgba(20,33,61,.06),0 4px 14px rgba(20,33,61,.06);
 --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0e1424;--panel:#172038;--fg:#eef2fb;--muted:#a3afc8;--line:#2a3658;--accent:#6c9dff;--accent-soft:#1d2b4f;--accent-fg:#0a1733;
 --ok:#63d394;--ok-bg:#14372a;--warn:#ffc874;--warn-bg:#3a2b10;--warn-line:#a8752a;--bad:#ff8f86;--bad-bg:#45201d;--shadow:none;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
html{height:100%}
body{min-height:100%;min-height:100dvh;display:flex;flex-direction:column}
body{color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px 8px}
.bar{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:44px}
.bar h1{flex:1;font-size:17px;margin:0;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:44px;height:44px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer;flex:none}
.icon:active{background:var(--line)}
.icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.icon.ghost{visibility:hidden}
.steps{max-width:520px;margin:6px auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps i{display:block;height:4px;border-radius:4px;background:var(--line);transition:background .25s}
.steps i.on{background:var(--accent)}
.wrap{flex:1;display:flex;flex-direction:column;width:100%;max-width:560px;margin:0 auto;padding:6px 16px calc(16px + env(safe-area-inset-bottom))}
.screen{flex:1;display:flex;flex-direction:column;animation:in .22s ease-out}
.grow{flex:1}
.grid.fill{flex:1;grid-auto-rows:minmax(76px,1fr)}
.grid.fill .tile{font-size:clamp(18px,5.4vw,24px)}
.bottom{position:sticky;bottom:0;margin:auto -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--bg) 18px);z-index:4}
.bottom.stack>*+*{margin-top:8px}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:22px;margin:8px 2px 14px;font-weight:800;letter-spacing:.01em;display:flex;align-items:baseline;gap:10px}
h2 .pos{margin-left:auto;font-size:14px;color:var(--muted);font-weight:800}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px;font-weight:700;cursor:pointer}
.chip small{color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;min-height:76px;border:1.5px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:var(--shadow);font-size:18px;font-weight:800;cursor:pointer;padding:12px 10px;text-align:center;word-break:keep-all;overflow-wrap:anywhere;line-height:1.3;transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tile .tag{position:absolute;top:6px;right:8px;font-size:11px;font-weight:700;color:var(--accent)}
.tile.add{color:var(--accent);border-style:dashed;box-shadow:none;background:transparent}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1}
.drop{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:260px;border:2px dashed var(--line);border-radius:22px;background:var(--panel);text-align:center;cursor:pointer;padding:24px}
.drop:active{background:var(--accent-soft)}
.drop svg{width:56px;height:56px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.drop b{font-size:20px}
.drop span{color:var(--muted);font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:4px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.status{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:300px;color:var(--muted);text-align:center}
.status img{max-width:60%;max-height:40vh;border-radius:12px;opacity:.9}
.spin{width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.amount{text-align:center;padding:16px 0 10px;border-bottom:1px solid var(--line)}
.amount small{display:block;color:var(--muted);font-size:13px;font-weight:700}
.amount b{font-size:34px;letter-spacing:.01em}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row dt{color:var(--muted);font-size:14px;font-weight:700;flex:none}
.row dd{margin:0;text-align:right;font-weight:700;word-break:break-all}
.row dd .sub{display:block;font-size:13px;color:var(--warn);font-weight:800;margin-top:2px}
.row.miss dd{color:var(--warn)}
.thumb{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.thumb img{width:56px;height:56px;object-fit:cover;border-radius:10px;background:var(--bg)}
.thumb span{flex:1;font-weight:700}
.thumb em{font-style:normal;color:var(--accent);font-size:14px;font-weight:700}
.note{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:700;margin-bottom:12px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:700;margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:16px;padding:14px;font-weight:800;font-size:17px;min-height:54px;cursor:pointer;transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.sub{background:var(--panel);color:var(--fg);border:1.5px solid var(--line)}
.btn.text{background:transparent;color:var(--fg);min-height:48px;font-size:16px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line)}
.btn:disabled{opacity:.45}
.btn.small{width:auto;min-height:46px;padding:10px 16px;font-size:15px;border-radius:12px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.stack>*+*{margin-top:10px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0;min-width:0}
input,select{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;min-height:48px;width:100%;min-width:0;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input:focus,select:focus{outline:none;border-color:var(--accent)}
input.empty,select.empty{border-color:var(--warn-line);background:var(--warn-bg)}
.hint{font-size:13px;color:var(--warn);font-weight:800}
.paper{position:relative;display:block;width:100%;height:230px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel);margin-bottom:12px;padding:0;cursor:zoom-in;box-shadow:var(--shadow)}
.paper img{width:100%;height:100%;object-fit:contain;display:block;background:var(--bg)}
.paper span{position:absolute;right:10px;bottom:10px;background:rgba(10,16,30,.72);color:#fff;font-size:14px;font-weight:800;padding:8px 12px;border-radius:999px;min-height:36px;display:flex;align-items:center;gap:6px}
.paper.pdf{display:grid;place-items:center;height:72px;cursor:default;font-weight:800;color:var(--muted)}
.viewer{position:fixed;inset:0;z-index:25;background:#000;display:flex;flex-direction:column}
.viewer .vbar{display:flex;justify-content:space-between;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;color:#fff}
.viewer .vbar b{font-size:15px}
.viewer .vbar button{min-height:44px;min-width:88px;border:0;border-radius:999px;background:#fff;color:#111;font-weight:800;font-size:16px;cursor:pointer}
.viewer .vbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}
.viewer img{display:block;width:100%;height:auto}
.viewer img.big{width:220%;max-width:none}
.slow{font-size:14px;color:var(--muted);max-width:260px}
.pages{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.pg{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.pg img{width:100%;height:100%;object-fit:cover;display:block}
.pg .pdf{display:grid;place-items:center;height:100%;font-weight:800;color:var(--muted);padding:8px;text-align:center;word-break:break-all;font-size:14px}
.pg .no{position:absolute;left:8px;top:8px;background:rgba(10,16,30,.72);color:#fff;font-size:13px;font-weight:800;border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;padding:0 8px}
.pg .rm{position:absolute;right:4px;top:4px;width:44px;height:44px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.pg .rm i{width:30px;height:30px;border-radius:50%;background:rgba(10,16,30,.72);color:#fff;display:grid;place-items:center;font-style:normal;font-size:18px;font-weight:800}
.pg.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);background:transparent;box-shadow:none;color:var(--accent);font-weight:800;cursor:pointer}
.pg.add svg{width:34px;height:34px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round}
.ready{font-size:13px;font-weight:800;color:var(--ok);text-align:center;margin-bottom:6px}
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;margin:0 0 12px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.carousel .paper{flex:0 0 100%;scroll-snap-align:center;margin:0}
.paper .cnt{left:10px;right:auto}
.viewer .vbody img+img{margin-top:8px}
.dots{display:flex;justify-content:center;gap:6px;margin:-4px 0 12px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .2s}
.dots i.on{background:var(--accent)}
.need{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:800;margin-bottom:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:800;cursor:pointer}
.seg button.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 10px 20px}
.done .mark{width:96px;height:96px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:0 auto 14px;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.done .mark svg{width:40px;height:40px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.done b{font-size:24px}
.done p{color:var(--muted);margin:6px 0 0;font-size:15px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--line);min-height:60px}
.li:last-child{border-bottom:0}
.li span{flex:1;font-weight:800;font-size:17px;word-break:break-all}
.li .icon{width:44px;height:44px}
.li .del{color:var(--bad)}
.li .icon:disabled{opacity:.25}
.empty-msg{padding:20px;text-align:center;color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,16,30,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet>div{background:var(--panel);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease-out;max-height:90vh;overflow:auto}
@keyframes up{from{transform:translateY(30px)}}
.sheet h3{margin:0 0 10px;font-size:18px}
.sheet p{margin:0 0 8px;color:var(--muted);font-size:15px}
.sheet img{width:100%;border-radius:12px;display:block}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:30;animation:fade .2s}
.foot{text-align:center;margin-top:22px}
.foot a{color:var(--muted);font-size:13px;font-weight:700;text-decoration:none;display:inline-block;padding:12px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <button class="icon" id="back" type="button" aria-label="戻る"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1 id="title">請求書かんたん入力</h1>
    <button class="icon" id="help" type="button" aria-label="使い方"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8 1c0 1.7-2.4 2.2-2.4 3.7"/><path d="M12 17.2h.01"/></svg></button>
  </div>
  <div class="steps" id="steps" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
</header>

<main class="wrap" id="app"></main>

<input id="file" type="file" accept="image/*,application/pdf" multiple hidden>

<script>
var INIT = null;
// GitHub Pages 版（Googleの帯なし）は INIT が無いので、ここで作って裏で最新の名前一覧を取る
var API_URL = 'https://script.google.com/macros/s/AKfycbx7QWD5YKKV45DEEBYmDwhxWFfLDeibupcTuJOSVYxOcd2IuL3_Bnz2cJbHrsLUr_Xi/exec';
var HOSTED = !(window.google && google.script && google.script.run);
if (!INIT) {
  var cached = null; try { cached = JSON.parse(localStorage.getItem('ciq_names') || 'null'); } catch (e) {}
  if (!cached || !cached.length) cached = ['まゆか', 'かずき(札幌)', 'こたろう', 'みずき', 'なす', 'りょう']; // 初回だけ。すぐ最新に置き換わる
  INIT = { stores: ['上野店', '渋谷店', '大宮店', '札幌店'], registrants: cached, admin: /[?&]page=admin/.test(location.search), url: location.origin + location.pathname };
}
var $ = function (id) { return document.getElementById(id); };
var app = $('app');
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k) || ''; localStorage.setItem(k, v); } catch (e) { return ''; } }
function yen(n) { return n ? '¥' + Number(String(n).replace(/\D/g, '')).toLocaleString() : ''; }
function jd(s) { var m = String(s || '').match(/(\d{4})-(\d{2})-(\d{2})/); return m ? Number(m[1]) + '/' + Number(m[2]) + '/' + Number(m[3]) : ''; }
function toast(t) { var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2200); }
function run(fn) {
  var args = [].slice.call(arguments, 1);
  if (HOSTED) {
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { if (!r.ok) throw new Error('通信に失敗しました（' + r.status + '）'); return r.json().catch(function () { throw new Error('混み合っています。少し待ってからもう一度'); }); },
        function () { throw new Error('通信できませんでした。電波の良い所でもう一度'); })
      .then(function (j) { if (!j.ok) throw new Error(j.error); return j.result; });
  }
  return new Promise(function (ok, ng) { google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { ng(new Error(e && e.message || String(e))); })[fn].apply(null, args); });
}

var S = {
  view: '', store: ls('ciq_store'), name: ls('ciq_name'),
  registrants: INIT.registrants || [], adding: false,
  pages: [], f: null, error: '', busy: false, reqId: 0,
  pre: null // 先読み: { key, promise } 写真がそろった時点で読み取りを始めておく
};
var MAX_PAGES = 10;
var NEED = ['vendor', 'description', 'amount', 'invoiceDate', 'dueDate', 'payMethod'];
var BANK = ['bank', 'branch', 'accountType', 'accountNumber', 'accountName'];
var LABEL = { vendor: '取引先', description: '請求内容', amount: '金額', invoiceDate: '請求日', dueDate: '支払期限', payMethod: '支払方法', bank: '銀行', branch: '支店', accountType: '種別', accountNumber: '口座番号', accountName: '口座名義', note: '備考' };
function needed() { return NEED.concat(S.f && S.f.payMethod === '銀行振込' ? BANK : []); }
function missing() { return needed().filter(function (k) { return !String(S.f[k] || '').trim(); }); }

// ---------- 画面の切り替え ----------
var ORDER = { store: 1, name: 2, photo: 3, reading: 3, confirm: 4, edit: 4, done: 4 };
function go(v) {
  S.view = v;
  var n = ORDER[v] || 0;
  [].forEach.call($('steps').children, function (el, i) { el.classList.toggle('on', i < n); });
  $('steps').hidden = !n || INIT.admin;
  $('back').classList.toggle('ghost', !(v === 'name' || v === 'photo' || v === 'edit' || v === 'confirm'));
  render();
  window.scrollTo(0, 0);
}
$('back').onclick = function () {
  if (S.busy) return;
  if (S.view === 'name') go('store');
  else if (S.view === 'photo') go('name');
  else if (S.view === 'edit') { readEdit(); go('confirm'); }
  else if (S.view === 'confirm') ask('この請求書をやめますか？', '入力した内容は消えます。', 'やめる', function () { resetDoc(); go('photo'); });
};

function saveNames(list) { S.registrants = list; try { localStorage.setItem('ciq_names', JSON.stringify(list)); } catch (e) {} }
function render() {
  var v = S.view, h = '';
  if (v === 'store') {
    h = '<div class="screen"><h2>どの店舗？<span class="pos">1/4</span></h2><div class="grid fill">' + INIT.stores.map(function (s) {
      return '<button class="tile' + (s === S.store ? ' sel' : '') + '" data-store="' + esc(s) + '">' + esc(s) + (s === S.store ? '<span class="tag">前回</span>' : '') + '</button>';
    }).join('') + '</div></div>';
  } else if (v === 'name') {
    h = '<div class="screen">' + chips(['store']) + '<h2>だれが登録？<span class="pos">2/4</span></h2><div class="grid fill">' + S.registrants.map(function (n) {
      return '<button class="tile' + (n === S.name ? ' sel' : '') + '" data-name="' + esc(n) + '">' + esc(n).replace(/[（(]/, '<wbr>$&') + (n === S.name ? '<span class="tag">前回</span>' : '') + '</button>';
    }).join('') + '<button class="tile add" id="addOpen" type="button">＋ 追加</button></div>' +
      (S.adding ? '<div class="addrow"><input id="newName" maxlength="20" placeholder="名前" autocomplete="off" enterkeyhint="done"><button class="btn primary small" id="addGo" type="button">追加</button></div>' : '') +
      '</div>';
  } else if (v === 'photo') {

function readEdit() {
  [].forEach.call(app.querySelectorAll('input[id^="e_"]'), function (i) {
    var k = i.id.slice(2), v = i.value.trim();

    if (k === 'dueDate' && v !== S.f[k]) S.f.dueGuessed = false;
    if (k === 'amount' || k === 'accountNumber') v = v.replace(/[０-９．]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
    if (k === 'amount') { var n = parseFloat(v.replace(/[^\d.]/g, '')); v = isFinite(n) ? String(Math.round(n)) : ''; }
    if (k === 'accountNumber') v = v.replace(/\D/g, '');
    if (String(S.f[k] == null ? '' : S.f[k]) !== v) S.sid = null; // 直したら別の登録として送る
    S.f[k] = v;
  });
}
function mark() {

  if (nd && (left || !nd.hidden)) { nd.hidden = false; nd.textContent = left ? '黄色の欄を入れてください（残り' + left + 'か所）' : '入力がそろいました'; nd.style.background = left ? '' : 'var(--ok-bg)'; nd.style.color = left ? '' : 'var(--ok)'; }

function resetDoc() { S.pages = []; S.pre = null; S.f = null; S.error = ''; S.busy = false; S.sid = null; S.reqId++; }

// 確認・ヘルプ用の下から出る画面

// ---------- 読み取り ----------
// 画像は長辺1600pxのJPEGに縮めてから送る（文字は十分読めて、送るのが速い）
function prepare(file) {
  return new Promise(function (ok, ng) {
    if (file.type === 'application/pdf' || (!file.type && /\.pdf$/i.test(file.name || ''))) {
      var r = new FileReader(); r.onload = function () { ok({ b64: r.result.split(',')[1], mime: 'application/pdf', url: null, name: file.name }); }; r.onerror = ng; r.readAsDataURL(file); return;
    }
    var img = new Image(); var u = URL.createObjectURL(file);
    img.onload = function () {
      var k = Math.min(1, 1600 / Math.max(img.width, img.height)); var c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); var d = c.toDataURL('image/jpeg', 0.82); URL.revokeObjectURL(u); ok({ b64: d.split(',')[1], mime: 'image/jpeg', url: d, name: file.name });
    };
    img.onerror = function () { ng(new Error('画像を開けませんでした')); }; img.src = u;
  });
}
$('file').addEventListener('change', function () {
  var list = [].slice.call(this.files || []); this.value = ''; if (!list.length) return;
  var room = MAX_PAGES - S.pages.length;
  if (list.length > room) { toast(MAX_PAGES + '枚までです'); list = list.slice(0, room); }
  S.error = '';
  Promise.all(list.map(function (f) { return prepare(f).catch(function () { return null; }); })).then(function (ps) {
    var good = ps.filter(Boolean);
    if (good.length < ps.length) toast((ps.length - good.length) + '枚を開けませんでした');
    if (!good.length) return;
    good.forEach(function (pg) { pg.id = ++PAGE_SEQ; });
    S.pages = S.pages.concat(good);
    if (S.view !== 'photo') { S.reqId++; S.f = null; S.sid = null; prefetch(); go('photo'); } // 読み取り中に写真が増えたら、その読み取りは使わない
    else { prefetch(); render(); }
  }).catch(function (e) { S.error = e.message; render(); });
});

// 写真がそろったら裏で読み取りを始めておく（「これで読み取る」を押した時にはもう終わっていることが多い）
var PAGE_SEQ = 0, preTimer = null;
function pageKey() { return S.pages.map(function (pg) { return pg.id; }).join('|'); }
// 続けて何枚も足す時に毎回読まないよう、最後の変更から1.5秒待ってから読む（「これで読み取る」は待たずにすぐ）
function prefetch(now) {
  clearTimeout(preTimer);
  if (!S.pages.length) { S.pre = null; return; }
  var key = pageKey();
  if (S.pre && S.pre.key === key && !S.pre.failed) return;
  if (!now) { S.pre = null; preTimer = setTimeout(function () { prefetch(true); }, 1500); return; }
  var pre = { key: key, done: false };
  pre.promise = run('analyze', S.pages.map(function (pg) { return { b64: pg.b64, mime: pg.mime, name: pg.name }; }));
  pre.promise.then(function () { pre.done = true; if (S.pre === pre && $('ready')) $('ready').hidden = false; }, function () { pre.failed = true; });
  S.pre = pre;
}
function startRead() {
  if (!S.pages.length) return;
  prefetch(true);
  var id = ++S.reqId, pre = S.pre;
  if (!pre.done) {
    go('reading');
    setTimeout(function () { if (S.reqId === id && S.view === 'reading' && $('slow')) $('slow').hidden = false; }, 12000);
  }
  pre.promise.then(function (res) {
    if (S.reqId !== id) return;
    S.f = res.fields; S.f.note = ''; go('confirm');
  }).catch(function (e) {
    if (S.reqId !== id) return;
    if (S.pre === pre) S.pre = null; // 失敗した読み取りは使い回さない
    S.error = e.message; go('photo');
  });
}

function submit() {
  if (S.busy) return;
  S.busy = true; S.error = ''; render();
  var id = S.reqId;
  S.sid = S.sid || (Date.now().toString(36) + Math.random().toString(36).slice(2, 10)); // 押し直しても1件だけ
  var v = { store: S.store, registrant: S.name, submitId: S.sid };
  ['vendor', 'description', 'amount', 'invoiceDate', 'dueDate', 'payMethod', 'bank', 'branch', 'accountType', 'accountNumber', 'accountName', 'note'].forEach(function (k) { v[k] = String(S.f[k] || '').trim(); });
  if (v.payMethod !== '銀行振込') BANK.forEach(function (k) { v[k] = ''; });
  var files = S.pages.map(function (pg, i) { return { b64: pg.b64, mime: pg.mime, name: (pg.name || '請求書').replace(/\.[^.]+$/, '') + (pg.mime === 'application/pdf' ? '.pdf' : '.jpg') }; });
  run('register', v, files).then(function () {
    if (S.reqId !== id) return;
    S.last = S.store + '・' + v.vendor + '・' + yen(v.amount); resetDoc(); go('done');
  }).catch(function (e) { if (S.reqId !== id) return; S.busy = false; S.error = e.message; render(); });
}

// ---------- はじめ ----------
if (INIT.admin) { $('title').textContent = '登録者名の管理'; go('admin'); $('back').classList.add('ghost'); }
else go('store'); // いつも 店舗 → 名前 → 写真 の順（前回の選択は印つき）
if (HOSTED) run('getInit').then(function (r) {
  saveNames(r.registrants);
  if (S.view === 'name' || S.view === 'admin') render();
}).catch(function () { if (!S.registrants.length) toast('名前の一覧を読み込めませんでした'); });
else saveNames(S.registrants);
</script>
</body>
</html>
